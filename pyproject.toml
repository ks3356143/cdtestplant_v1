    "django-tinymce>=5.0.0",
    "docxcompose>=2.1.0",
    "docxtpl[subdoc]>=0.20.2",
    "faker>=40.13.0",
    "ipykernel>=7.2.0",
    "lizard>=1.21.3",
    "mysqlclient>=2.2.7",
    "ninja-schema>=0.14.3",
    "numpy==2.4.4",
    "orjson>=3.11.8",
    "pandas>=3.0.2",
    "pyinstaller>=6.19.0",
    "python-docx>=1.2.0",
    "python-ldap",
    "setuptools<=82.0.1",
    "ua-parser-builtins>=202601",
    "user-agents>=2.2.0",
    "waitress>=3.0.2",
