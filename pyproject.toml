[project]
name = "cdtestplant-v1"
version = "0.1.1"
description = "测试管理平台后端程序"
readme = "README.md"
requires-python = ">=3.13.11,<3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "django>=6.0.8",
    "django-auth-ldap>=5.3.0",
    "django-environ>=0.14.0",
    "django-ninja>=1.6.2",
    "django-ninja-extra>=0.31.6",
    "django-ninja-jwt>=5.4.5",
    "django-redis>=7.0.0",
    "django-shortuuidfield>=0.1.3",
    "django-tinymce>=5.0.0",
    "docxcompose>=2.2.0",
    "docxtpl[subdoc]>=0.20.2",
    "faker>=40.35.0",
    "ipykernel>=7.3.0",
    "lizard>=1.23.0",
    "mysqlclient>=2.2.7",
    "ninja-schema>=0.14.3",
    "numpy==2.5.1",
    "orjson>=3.11.9",
    "pandas>=3.0.3",
    "python-docx>=1.2.0",
    "python-ldap",
    "setuptools<=82.0.1",
    "ua-parser-builtins>=202601",
    "user-agents>=2.2.0",
    "waitress>=3.0.2",
    "pydantic>=2.13.4",
    "lxml>=6.1.1",
    "requests>=2.34.2",
]

[tool.uv.sources]
python-ldap = { path = "python_ldap-3.4.5-cp313-cp313-win_amd64.whl" }

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]
