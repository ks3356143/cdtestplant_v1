#user  nobody;

worker_processes  auto;

error_log  logs/error_https.log  warn;
pid        logs/nginx_https.pid;

events {
    worker_connections  1024;
}

http {
    include       E:/pycharmProjects/cdtestplant_v1-AI/packagesInitialize/nginx-1.28.0/conf/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 100M;

    # HTTPS 服务：自签名证书，本地测评演示用（GB/T 28452-2012 7.1.1 鉴别信息传输加密）
    server {
        listen       8443 ssl;
        server_name  localhost;

        # 证书路径为仓库 deploy/https 下的自签证书（绝对路径，按实际检出位置调整）
        ssl_certificate      E:/pycharmProjects/cdtestplant_v1-AI/deploy/https/localhost.crt;
        ssl_certificate_key  E:/pycharmProjects/cdtestplant_v1-AI/deploy/https/localhost.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;
        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  10m;

        # 前端静态资源（构建产物复制到 nginx-1.28.0/html/dist）
        location / {
            root   html/dist;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
            error_page 405 =200 @405;
        }

        # 后端 API 反向代理（HTTP 明文仅在本机回环内）
        location /api {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PUT';
            add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization';
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
            proxy_pass http://127.0.0.1:8000;
        }

        # 上传文件访问
        location /uploads/ {
            proxy_set_header Host $http_host;
            proxy_pass http://127.0.0.1:8000;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
